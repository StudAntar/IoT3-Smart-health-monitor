<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Login - Smart Health Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>
<body class="bg-light">
  <div class="container mt-5" style="max-width: 420px;">
    <h2 class="mb-2">Smart Health Monitor</h2>
    <p class="text-muted">Log ind for at få adgang</p>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Brugernavn</label>
        <input class="form-control" name="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Kodeord</label>
        <input class="form-control" type="password" name="password" required>
      </div>

      <button class="btn btn-primary w-100" type="submit">Log ind</button>
    </form>
  </div>
</body>
</html>
